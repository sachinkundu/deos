name: Sandbox inventory audit

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Read provider inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTAINER_APPLICATION_ID: ${{ secrets.CLOUDFLARE_CONTAINER_APPLICATION_ID }}
        run: |
          if ! npx wrangler containers instances "$CONTAINER_APPLICATION_ID" --json > sandbox-inventory.json; then
            node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const output = readFileSync('sandbox-inventory.json', 'utf8');
          console.error(output.replaceAll(process.env.CLOUDFLARE_API_TOKEN, '[REDACTED]').slice(0, 2000));
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const app = process.env.CONTAINER_APPLICATION_ID;
          for (const path of [`/accounts/${account}/containers/applications/${app}/instances`, `/accounts/${account}/containers/dash/applications/${app}/instances`]) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN },
              redirect: 'error', signal: AbortSignal.timeout(20000),
            });
            const body = await response.json();
            console.log(JSON.stringify({ endpoint: path.includes('/dash/') ? 'dashboard-inventory' : 'application-inventory', status: response.status, success: body.success,
              errorCodes: body.errors?.map(error => error.code) }));
          }
          JS
            exit 1
          fi
      - name: Submit inventory to trusted audit endpoint
        env:
          DEOS_CLEANUP_AUDIT_URL: ${{ secrets.DEOS_CLEANUP_AUDIT_URL }}
          DEOS_CLEANUP_AUDIT_SECRET: ${{ secrets.DEOS_CLEANUP_AUDIT_SECRET }}
        run: node scripts/audit-sandbox-inventory.mjs < sandbox-inventory.json
