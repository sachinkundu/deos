name: Deploy portal staging

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'src/**'
      - 'scripts/*portal*.py'
      - 'scripts/shared_test*.py'
      - 'package*.json'
      - '.github/workflows/portal-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-staging-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: avrea-ubuntu-latest-2-vcpu
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Deploy and verify staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_STAGING_CLOUDFLARE_API_TOKEN }}
          SHARED_TEST_UPLOAD_TRANSPORT: s3
          SHARED_TEST_R2_UPLOAD_TOKEN: ${{ secrets.SHARED_TEST_R2_UPLOAD_TOKEN }}
          PORTAL_ACCESS_CLIENT_ID: ${{ vars.PORTAL_ACCESS_CLIENT_ID }}
          PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PORTAL_ACCESS_CLIENT_SECRET }}
        run: |
          python -m pip install boto3==1.40.0
          python scripts/deploy_portal_staging.py
