name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest ruff

      - name: Lint Python
        run: ruff check src tests

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Compile source and tests
        run: python -m compileall -q src tests

  typescript:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test TypeScript
        run: npm test

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Check generated Worker bindings
        run: npm run types:check

      - name: Validate Wrangler configurations
        run: |
          npx wrangler deploy --dry-run --config wrangler.queue-consumer-ts.jsonc
          npx wrangler deploy --dry-run --config wrangler.jsonc
