name: Pin shared test staging base

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-staging-deploy
  cancel-in-progress: false
  queue: max

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: avrea-ubuntu-latest-2-vcpu
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check live attempt and staging state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_STAGING_CLOUDFLARE_API_TOKEN }}
        run: python scripts/check_shared_test_bootstrap.py
      - name: Pin both staging services after two live readbacks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTAL_STAGING_CLOUDFLARE_API_TOKEN }}
          PORTAL_ACCESS_CLIENT_ID: ${{ vars.PORTAL_ACCESS_CLIENT_ID }}
          PORTAL_ACCESS_CLIENT_SECRET: ${{ secrets.PORTAL_ACCESS_CLIENT_SECRET }}
        run: python scripts/bootstrap_shared_test_staging.py
