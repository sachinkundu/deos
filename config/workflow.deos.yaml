apiVersion: deos.dev/v1alpha1
kind: DeliveryWorkflow
metadata:
  name: openspec-delivery
  version: 11
spec:
  start: requirements
  execution:
    attemptTimeout: 24h
    heartbeatTimeout: 5m
    codexSandboxMode: danger-full-access
  jobs:
    requirements:
      promptFile: prompts/requirements.md
      inputs: [linear_issue, repository_context]
      context: [shared_workpad]
      resultSchema: schemas/agent-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    requirements_review:
      promptFile: prompts/requirements-review.md
      inputs: [requirements_result, review_history]
      context: [shared_workpad]
      resultSchema: schemas/review-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    bdd_review:
      promptFile: prompts/bdd-review.md
      inputs: [proposal, requirements, delta_specs]
      context: [shared_workpad]
      resultSchema: schemas/review-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    ddd_architecture:
      promptFile: prompts/ddd-architecture.md
      inputs: [approved_specs]
      context: [shared_workpad]
      resultSchema: schemas/agent-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    ddd_review:
      promptFile: prompts/ddd-review.md
      inputs: [approved_specs, design]
      context: [shared_workpad]
      resultSchema: schemas/review-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    implementation:
      promptFile: prompts/implementation.md
      inputs: [approved_specs, approved_design, tasks]
      context: [shared_workpad, prior_artifact_manifests]
      resultSchema: schemas/agent-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    code_review:
      promptFile: prompts/code-review.md
      inputs: [implementation_result, branch, diff, validation]
      context: [shared_workpad]
      resultSchema: schemas/review-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    evidence_verification:
      promptFile: prompts/evidence-verification.md
      inputs: [evidence_pack, acceptance_criteria]
      context: [shared_workpad]
      resultSchema: schemas/review-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
    openspec_continue:
      promptFile: prompts/openspec.md
      inputs: [linear_issue, openspec_change, openspec_instruction]
      context: [shared_workpad, prior_artifact_manifests]
      resultSchema: schemas/agent-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
      operation: {kind: openspec, instruction: /opsx:continue}
    openspec_apply:
      promptFile: prompts/openspec.md
      inputs: [linear_issue, openspec_change, openspec_instruction]
      context: [shared_workpad, prior_artifact_manifests]
      resultSchema: schemas/agent-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
      operation: {kind: openspec, instruction: /opsx:apply}
    openspec_verify:
      promptFile: prompts/openspec.md
      inputs: [linear_issue, openspec_change, openspec_instruction]
      context: [shared_workpad, prior_artifact_manifests]
      resultSchema: schemas/agent-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
      operation: {kind: openspec, instruction: /opsx:verify}
    openspec_archive:
      promptFile: prompts/openspec.md
      inputs: [linear_issue, openspec_change, openspec_instruction]
      context: [shared_workpad, prior_artifact_manifests]
      resultSchema: schemas/agent-result-v1.json
      requiredOutputs: [transcript.jsonl, result.json, patch.diff, validation.txt, provider-references.json]
      operation: {kind: openspec, instruction: /opsx:archive}
  nodes:
    requirements:
      type: agent
      job: requirements
      edges: {completed: requirements_review, blocked: agent_blocked, failed: agent_failed}
    requirements_review:
      type: agent
      job: requirements_review
      edges: {approved: requirements_approval, changes_requested: requirements, blocked: agent_blocked, failed: agent_failed}
    requirements_approval:
      type: human_gate
      linearState: Human Review
      edges: {approved: openspec_proposal, rejected: requirements}
    openspec_proposal:
      type: agent
      job: openspec_continue
      edges: {completed: openspec_specs, blocked: agent_blocked, failed: agent_failed}
    openspec_specs:
      type: agent
      job: openspec_continue
      edges: {completed: bdd_review, blocked: agent_blocked, failed: agent_failed}
    bdd_review:
      type: agent
      job: bdd_review
      edges: {approved: ddd_architecture, changes_requested: openspec_specs, blocked: agent_blocked, failed: agent_failed}
    ddd_architecture:
      type: agent
      job: openspec_continue
      edges: {completed: ddd_review, blocked: agent_blocked, failed: agent_failed}
    ddd_review:
      type: agent
      job: ddd_review
      edges: {approved: architecture_approval, changes_requested: ddd_architecture, blocked: agent_blocked, failed: agent_failed}
    architecture_approval:
      type: human_gate
      linearState: Human Review
      edges: {approved: openspec_tasks, rejected: ddd_architecture}
    openspec_tasks:
      type: agent
      job: openspec_continue
      edges: {completed: implementation, blocked: agent_blocked, failed: agent_failed}
    implementation:
      type: agent
      job: openspec_apply
      edges: {completed: code_review, blocked: agent_blocked, failed: agent_failed}
    code_review:
      type: agent
      job: code_review
      edges: {approved: evidence_verification, changes_requested: implementation, blocked: agent_blocked, failed: agent_failed}
    evidence_verification:
      type: agent
      job: evidence_verification
      edges: {certified: openspec_verify, changes_requested: implementation, blocked: agent_blocked, failed: agent_failed}
    openspec_verify:
      type: agent
      job: openspec_verify
      edges: {completed: final_approval, blocked: implementation, failed: implementation}
    final_approval:
      type: human_gate
      linearState: Human Review
      edges: {approved: sync_and_archive, rejected: denied}
    sync_and_archive:
      type: agent
      job: openspec_archive
      edges: {completed: done, blocked: agent_blocked, failed: agent_failed}
    done: {type: terminal, deosStatus: succeeded, executorAction: return}
    denied: {type: terminal, deosStatus: denied, executorAction: return}
    canceled: {type: terminal, deosStatus: canceled, executorAction: return}
    agent_blocked:
      type: failure
      deosStatus: failed
      executorAction: throw
      cause: agent_outcome_blocked
    agent_failed:
      type: failure
      deosStatus: failed
      executorAction: throw
      cause: agent_execution_failed
    system_action_failed:
      type: failure
      deosStatus: failed
      executorAction: throw
      cause: system_action_invariant_failed
