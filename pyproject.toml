[project]
name = "deos"
version = "0.1.0"
description = "Linear-driven Cloudflare workflow"
requires-python = ">=3.11"
dependencies = [
    "workers-runtime-sdk>=1.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.9",
    "workers-py>=1.9",
]

[dependency-groups]
dev = [
    "workers-py>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
