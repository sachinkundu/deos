schema: spec-driven

context: |
  Project: deos — a serverless, Linear-driven software engineering workflow.
  Current scope: initial architecture for Linear webhook ingress, durable dispatch,
  workflow state, human approvals, OpenSpec artifacts, and Python-based agents on
  Cloudflare Workers where practical.
  Engineering preference: readable Python managed with uv, pyproject.toml, ruff,
  pyright, and pytest. Keep the first slice small, deterministic, auditable, and
  safe to run without production credentials or live agent side effects.
  External events must be authenticated, idempotent, and processed asynchronously.
  Human approval is an explicit state and must not be bypassed by automation.

rules:
  proposal:
    - Keep the proposal concise and implementation-oriented.
    - State non-goals explicitly.
    - Prefer Python unless a Cloudflare runtime constraint makes TypeScript materially better.
  design:
    - Include a component diagram, event flow, minimal data model, and failure modes.
  tasks:
    - Break work into independently verifiable increments.
    - Include deterministic tests before live integrations.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
