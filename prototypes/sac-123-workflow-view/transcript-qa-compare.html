<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEOS transcript visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #020812; color: white; font-family: Inter, system-ui, sans-serif; }
      header { padding: 22px 24px 8px; font-size: 20px; font-weight: 700; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 14px 24px 24px; }
      figure { margin: 0; padding: 10px; border: 1px solid #22364a; border-radius: 10px; background: #07121f; }
      figcaption { margin: 0 0 8px; color: #94a5b8; font-size: 12px; font-weight: 600; }
      img { display: block; width: 100%; height: 650px; object-fit: contain; background: #07121f; }
    </style>
  </head>
  <body>
    <header>Transcript modal design-system comparison</header>
    <main>
      <figure><figcaption>Approved modal direction</figcaption><img src="/interaction-agent-transcript-placeholder.png" alt="Approved transcript modal direction" /></figure>
      <figure><figcaption>Implemented verified Activity view</figcaption><img src="/implementation-transcript-activity.png" alt="Implemented transcript Activity view" /></figure>
    </main>
  </body>
</html>
